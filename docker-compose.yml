services:
  agents:
    build: .
    environment:
      QUIETDESK_ENGINE: fixture
      QUIETDESK_HOST: 0.0.0.0
      QUIETDESK_PORT: 8787
    ports:
      - "8787:8787"

  app:
    image: node:22-bookworm-slim
    working_dir: /ui
    volumes:
      - ./app:/ui
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3010"
    environment:
      AGENT_URL: http://agents:8787
    ports:
      - "3010:3010"
    depends_on:
      - agents
