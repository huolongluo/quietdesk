  <text x="40" y="310" fill="#9a917f" font-family="system-ui" font-size="13">AUTO: open-bay reschedule · NAPA standing PO under $80</text>
  <text x="40" y="334" fill="#9a917f" font-family="system-ui" font-size="13">HOLD: refunds · warranty · angry · quotes $150+ · unknown vendors</text>
  <text x="40" y="380" fill="#e8e2d4" font-family="system-ui" font-size="13">Tools persist Shift JSON. AgentCore optional. The model drafts. It does not bind.</text>
